"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true # Recomendado para não poluir com tantas informações
command_timeout = 500 # Aumentei um pouco para chamadas de API (AWS/K8s)
palette = "tokyo-night"

format = """$directory$git_branch $git_status$git_metrics$fill $kubernetes $username $hostname ${custom.taskwarrior_overdue}${custom.taskwarrior_total} $cmd_duration $time
$character"""

right_format = """$aws ${custom.aws_remain} $terraform$gcloud$python"""

[character]
error_symbol = "[✗](bold purple)"
success_symbol = "[❯](bold green)"

# Fill character (empty space) between the left and right prompt
[fill]
symbol = "·"
style = "bold bright-black"

[directory]
#truncation_length = 3
#fish_style_pwd_dir_length = 5
truncation_symbol = "…/"
truncation_length = 8 # 0 mostra o caminho completo
fish_style_pwd_dir_length = 3
style = "bold blue"
repo_root_style = "bold cyan"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)'
style = "italic purple"

[git_status]
format = '([$all_status$ahead_behind]($style)) '
style = "bold yellow"
conflicted = '[conflict:${count} ](bold red)'
ahead = '[⇡ahead:${count} ](bold green)'
behind = '[⇣behind:${count} ](bold red)'
diverged = '[⇕diver:${ahead_count}/${behind_count} ](bold red)'
up_to_date = ''
untracked = '[?untr:${count} ](bold red)'
stashed = '[stash:${count} ](bold purple)'
modified = '[!mod:${count} ](bold yellow)'
staged = '[+staged:${count} ](bold green)'
renamed = '[»ren:${count} ](bold cyan)'
deleted = '[✘del:${count} ](bold red)'

[git_state]
format = '[$symbol$state( $progress_current/$progress_total)]($style) '
style = "bold yellow"
rebase = "󰜦 REBASING"
merge = " MERGING"
revert = "󰕌 REVERTING"
cherry_pick = "󰐕 CHERRY-PICKING"
bisect = "󰇉 BISECTING"
am = "APPLYING"
am_or_rebase = "APPLYING/REBASING"

[git_metrics]
added_style = 'bold green'
deleted_style = 'bold red'
format = 'Δ[+$added]($added_style)/[-$deleted]($deleted_style)'
disabled = true

[time]
disabled = false
format = "[$time]($style)"
time_format = "%T"
style = "dimmed white"

[python]
format = '[${pyenv_prefix}(${version})(\($virtualenv\))]($style)'

[cmd_duration]
min_time = 500
format = "dur [$duration]($style)"
show_milliseconds = true

[username]
style_user = "white bold"
style_root = "black bold"
format = "[$user]($style)"
#disabled = true
disabled = false
show_always = true

[aws]
symbol = " "
format = '[$symbol($profile)(\($region\))(\[$duration\])]($style)'
style = "bold yellow"

[kubernetes]
symbol = "󱃾 "
#format = "at [$symbol$context]($style) "
format = '[$symbol$context(\($namespace\))]($style)'
style = "cyan bold"
disabled = false

[terraform]
symbol = "󱁢 "
format = "[$symbol$version]($style)"
detect_extensions = ['tf', 'tfplan', 'tfstate', 'hcl', 'tfvars']

# Conta e projeto do contexto ativo (o starship já respeita CLOUDSDK_ACTIVE_CONFIG_NAME)
[gcloud]
format = '[$symbol$account(@$domain)(\($project\))]($style)'
symbol = "󱇶 "
style = "bold blue"

# Selo vermelho quando o projeto tem "prd" ou "prod" (vem do gcpctl)
[env_var.GCPCTL_PROD]
format = '[ \uf071 $env_value ]($style)'
style = "bold bg:red fg:white"

[custom.taskwarrior_overdue]
command = "task +OVERDUE status:pending count 2>/dev/null"
when = "command -v task"
shell = ["bash", "--noprofile", "--norc"]
format = '[$symbol$output]($style)'
symbol = "󰄬 "
style = "bold red"

[custom.taskwarrior_total]
command = "task status:pending count 2>/dev/null"
when = "command -v task"
shell = ["bash", "--noprofile", "--norc"]
format = '[/]($style)[$output]($style)'
style = "bold purple"

[custom.aws_remain]
command = "aws_remain"
when = 'test -n "${AWS_CREDENTIAL_EXPIRATION:-}" || { test -n "${AWS_SHARED_CREDENTIALS_FILE:-}" && test -f "${AWS_SHARED_CREDENTIALS_FILE}"; }'
format = "[$symbol $output]($style)"
symbol = "󰥔"
style = "bold bright-yellow"
description = "AWS session time remaining (env or kwork credentials file)"

[palettes.tokyo-night]
black = "#1a1b26"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
purple = "#ad8ee6"
cyan = "#449dab"
white = "#a9b1d6"
bright-black = "#414868"
bright-red = "#ff7a93"
bright-green = "#b9f27c"
bright-yellow = "#ff9e64"
bright-blue = "#7da6ff"
bright-purple = "#bb9af7"
bright-cyan = "#0db9d7"
bright-white = "#c0caf5"
