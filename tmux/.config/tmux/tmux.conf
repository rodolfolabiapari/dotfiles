# TMUX - guia prévio de leitura de config
# -------------------
#
# O tmux divide em "paineis" (splits), "janelas" (tabs), e sessões.
#
# Prefixo: a maioria dos atalhos exige segurar o prefixo ANTES
#   Prefixo principal: Ctrl+Space (minha config pessoal)
#   Prefixo alternativo: Ctrl+b (original do tmux)
#
# Notacao utilizada nos comentaários:
#   Ctrl+...  = Tecla Control
#   Alt+...   = Tecla Option (macOS) / Meta
#   Shift+... = tecla Shift
#
# Recarregar esse arquivo dentro do tmux: Prefixo + q

# --- Prefixo ------------------------------------------------------------------
# Define qual tecla "abre" os atlhos 
set -g prefix C-Space
set -g prefix2 C-b
# Envia o prefixo literal para o programa (útil com prefixo duplo)
bind C-Space send-prefix

# --- Recarega Configuração ----------------------------------------------------
bind q source-file ~/.config/tmux/tmux.conf

# --- Modo de cópia estilo VIM -------------------------------------------------
# No modo cópia, navega-se como vim
setw -g mode-keys vi
# v -> inicia a selecao
bind -T copy-mode-vi v send -X begin-selection
# y -> copia e sai do modo cópia #todo
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Painéis (splits) ---------------------------------------------------------
# Atalhos SEM prefixo (-n): funciona direto, sem Ctrl+Space antes

# Alt+Enter -> Divite a tela horizontal
bind -n M-Enter split-window -v -c "#{pane_current_path}"

# Alt+Shift+Enter -> Divite a tela vertical
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
# Alt+Scape -> fecha o painel
# bind -n M-Escape kill-pane

# Atalhos COM prefixo
# Prefixo + " -> split horizontal
# Prefixo + % -> Split vertical
# Prefixo + x -> fecha terminal
bind \" split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# bind x kill-pane

# --- Navegação entre painéis (sem prefixo) ------------------------------------
# Ctrl+Alt + setas ou hjkl  -> move o foco
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-h select-pane -L
bind -n C-M-l select-pane -R
bind -n C-M-k select-pane -U
bind -n C-M-j select-pane -D

# --- Redimenciona Paineis (sem prefixo) ---------------------------------------
# Ctrl+Alt+Shift + setas ou hjkl  -> redimencioan 5 linhas
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# --- Janelas (abas) -----------------------------------------------------------
# Prefixo + r -> renomeia
bind r command-prompt -I "#W" "rename-window -- '%%'"
# Prefixo + c -> Nova janela no mesmo diretório
bind c new-window -c "#{pane_current_path}"
# Prefixo + k -> fecha a janela atual
# bind k kill-window

# Alt+1 -> muda direto para a jenale (sem prefixo)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
# Alt+ Seta -> anda nas janelas
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
# Alt + h / Alt + l -> anda nas janels
bind -n M-h select-window -t -1
bind -n M-l select-window -t +1
# Alt + Shift + Setas -> troca a ordem das anelas
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# --- Sessões ------------------------------------------------------------------
# Sessão = Grupo  de janelas
# Prefixo + R -> renomeia sessao
bind R command-prompt -I "#S" "rename-session -- '%%'"
# Prefixo + C -> Nova sessao
bind C new-session -c "#{pane_current_path}"
# Prefixo + K -> Mata sessao
# bind K kill-session
# Prefixo + P / N anda nas sessoes
bind P switch-client -p
bind N switch-client -n

# Alt+Setas -> troca sessao
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# --- Opcoes Gerais ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g history-file ~/.tmux_history
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -sg escape-time 0

# --- Barra de Status ----------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# --- Visual e Tema ------------------------------------------------------------
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
# Direita: Copy | Prefix prefixo ativo | ZOOM | hostname
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# --- Popups Janelas flututantes temporárias -----------------------------------
# Prefixo + Ctrl+b -> edita bashrc
bind C-b display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ~/.bashrc'

# Prefixo + Ctrl+t -> shell bash temporário
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "bash"

# Prefixo + Ctrl+o -> Abre Obsidian
bind C-t display-popup \
  -d "~/Documents/obsidian/linux" \
  -w 75% \
  -h 75% \
  -E "nvim README.md"


# --- vim-tmux-navigator -------------------------------------------------------
# Ctrl+hjkl navega entre sptios do Neovim e paineis tmux
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# No modo cópia, Ctrl+hjkl move também entre paineis
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
